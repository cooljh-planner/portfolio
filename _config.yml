# ============================================================
#  사이트 설정 파일  (_config.yml)
#  - 따옴표(") 안의 글자만 바꾸시면 됩니다.
#  - 설정을 바꾼 뒤에는 GitHub 에서 1~2분 기다리면 반영됩니다.
# ============================================================

# ▼ 여기만 바꾸세요 ------------------------------------------
title: "My Portfolio"                 # 사이트 이름 (맨 위 왼쪽에 표시)
description: "서비스 기획·DT·AX 프로젝트 아카이브와 인사이트를 기록하는 포트폴리오 블로그입니다."   # 검색·공유할 때 보이는 한 줄 설명
footer_text: ""                       # 맨 아래에 덧붙일 문구 (필요 없으면 비워 두세요)
default_layout_type: image-top        # 글에 layout_type 을 안 적었을 때 쓸 기본 모양
                                      #   image-top / image-left / image-right / gallery / text-only
default_category: "포스트"             # 글에 category 를 안 적었을 때 쓸 기본 카테고리
category_order: ["프로젝트", "인사이트", "회고", "포스트"]   # 목록 카테고리 탭 표시 우선순위
default_pdf: true                     # 글에 pdf 키를 안 적었을 때의 기본 슬라이드 PDF 포함 여부
# -----------------------------------------------------------

# ▼ 아래는 건드리지 않는 것을 권장합니다 ----------------------
lang: ko
timezone: Asia/Seoul
permalink: /posts/:title/             # 글 주소 형태 (예: /posts/글-이름/)
markdown: kramdown
theme: null                           # GitHub Pages 기본 테마를 끕니다 (이 사이트는 자체 디자인을 사용)

# url / baseurl 은 일부러 적지 않았습니다.
# GitHub Pages 가 자동으로 채워 주기 때문에 사용자 사이트(아이디.github.io)와
# 프로젝트 사이트(아이디.github.io/저장소이름) 어느 쪽에서도 그대로 동작합니다.

# _posts 안의 모든 글에 'post' 모양틀을 자동으로 씌웁니다.
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"

# 사이트에 올리지 않을 파일/폴더 (안내문서, 템플릿 등)
# 폴더는 끝에 / 를 붙여 적었습니다. (붙이지 않으면 docs-guide.md 처럼 이름이 비슷한 글까지 빠집니다)
exclude:
  - README.md
  - test.md
  - docs/
  - _templates/
  - Gemfile
  - Gemfile.lock
  - vendor/
  - node_modules/
  - .workflow/
  - tools/
  - dist/
  - START-HERE.html
  # --- 보조 안전장치 (보장이 아닙니다) -----------------------------------------------
  # 실수로 폴더에 들어온 "비밀 키·인증서·백업" 파일이 '사이트'에 공개되지 않게 하는 마지막 보조 장치입니다.
  #  - 막는 것: 이름이 정확히 아래와 같은 것  (*.pem *.p12 *.pfx *.p8 *.crt *.cer *.kdbx *.ppk, id_rsa* 등 키 파일,
  #            *.bak *.orig *.swp *~ 백업, credentials.json / client_secret*.json / service-account*.json,
  #            passwords.txt / secret.txt 등, secrets 폴더)
  #  - 못 막는 것: 위 목록에 없는 이름 (예: my-passwords-2024.txt). 비밀번호·키 파일은 애초에 이 폴더에 두지 마세요.
  #  - 사이트에서만 빠질 뿐, GitHub 저장소에 올린 파일은 저장소에 그대로 남아 공개됩니다.
  #  - 일부러 좁게 적었습니다. (*.key 는 키노트 파일까지 막기 때문에 뺐고, 이름 중간에 id_rsa 가 들어간 글은 막지 않습니다)
  - "*.pem"
  - "*.p12"
  - "*.pfx"
  - "*.p8"
  - "*.crt"
  - "*.cer"
  - "*.kdbx"
  - "*.ppk"
  - "id_rsa*"
  - "*/id_rsa*"
  - "id_dsa*"
  - "*/id_dsa*"
  - "id_ecdsa*"
  - "*/id_ecdsa*"
  - "id_ed25519*"
  - "*/id_ed25519*"
  - "*.bak"
  - "*.orig"
  - "*.swp"
  - "*~"
  - "credentials.json"
  - "*/credentials.json"
  - "credentials.txt"
  - "*/credentials.txt"
  - "client_secret*.json"
  - "*/client_secret*.json"
  - "service-account*.json"
  - "*/service-account*.json"
  - "passwords.txt"
  - "*/passwords.txt"
  - "password.txt"
  - "*/password.txt"
  - "secret.txt"
  - "*/secret.txt"
  - "secrets/"
  - "*/secrets/*"
